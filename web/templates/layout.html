<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunity Hunter</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:system-ui,-apple-system,sans-serif;background:#1a1a2e;color:#f3f4f6}
        .container{max-width:960px;margin:0 auto;padding:1rem}
        header{background:#12121f;color:#f3f4f6;padding:1rem 0;border-bottom:1px solid #2d2b4a}
        .header-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
        header h1{font-size:1.5rem;color:#f3f4f6}
        nav{display:flex;gap:.5rem;margin-top:.75rem;flex-wrap:wrap}
        nav a{color:rgba(255,255,255,.45);text-decoration:none;padding:.4rem .85rem;border-radius:6px;font-size:.9rem;transition:all .15s}
        nav a.active{background:rgba(255,255,255,.1);color:#f3f4f6}
        nav a:hover{color:#f3f4f6;background:rgba(255,255,255,.07)}
        .btn-status{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .75rem;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid #374151;color:rgba(255,255,255,.7);text-decoration:none;font-size:.85rem;transition:all .15s;white-space:nowrap}
        .btn-status:hover{background:rgba(255,255,255,.1);color:#f3f4f6}
        .btn-status.active{background:rgba(99,102,241,.2);border-color:#6366f1;color:#a5b4fc}
        .status-dot{width:8px;height:8px;border-radius:50%;background:#86efac;flex-shrink:0}
        .btn-ghost{padding:.35rem .75rem;background:transparent;border:1px solid #374151;border-radius:6px;color:#9ca3af;cursor:pointer;font-size:.85rem;transition:all .15s}
        .btn-ghost:hover{border-color:#6366f1;color:#a5b4fc;background:rgba(99,102,241,.1)}
        .toolbar{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin:1rem 0 .5rem;padding:.75rem;background:#222238;border-radius:8px;border:1px solid #2d2b4a;font-size:.85rem}
        .toolbar label{color:#9ca3af;font-weight:500}
        .toolbar select{padding:.3rem .5rem;border:1px solid #374151;border-radius:6px;font-size:.85rem;background:#1a1a2e;color:#f3f4f6}
        .toolbar select:focus{outline:none;border-color:#6366f1}
        .toolbar .count{margin-left:auto;color:#6b7280}
        .prefs-toggle{background:none;border:1px solid #374151;border-radius:6px;padding:.2rem .5rem;cursor:pointer;font-size:1rem;line-height:1;color:#9ca3af}
        .prefs-toggle:hover{background:rgba(255,255,255,.06);border-color:#6366f1}
        .prefs-panel{max-height:0;overflow:hidden;transition:max-height .25s ease,padding .25s ease;background:#222238;border-radius:8px;border:1px solid #2d2b4a;margin-bottom:0}
        .prefs-panel.open{max-height:500px;padding:1rem;margin-bottom:.5rem}
        .prefs-header{margin-bottom:.5rem}
        .prefs-header strong{font-size:.9rem;color:#f3f4f6}
        .prefs-hint{font-size:.75rem;color:#6b7280;margin-left:.5rem}
        .prefs-panel textarea{width:100%;min-height:60px;padding:.5rem;border:1px solid #374151;border-radius:6px;font-family:inherit;font-size:.85rem;resize:vertical;background:#1a1a2e;color:#f3f4f6}
        .prefs-panel textarea::placeholder{color:#6b7280}
        .prefs-panel textarea:focus{outline:none;border-color:#6366f1}
        .prefs-panel button[type="submit"]{margin-top:.4rem;padding:.35rem .8rem;background:#6366f1;color:white;border:none;border-radius:6px;cursor:pointer;font-size:.85rem;transition:background .15s}
        .prefs-panel button[type="submit"]:hover{background:#4f46e5}
        .schedule-form{margin-top:1rem;padding-top:.75rem;border-top:1px solid #374151}
        .schedule-row{display:flex;gap:.5rem;align-items:center;margin-top:.4rem;flex-wrap:wrap}
        .schedule-row select{padding:.3rem .5rem;border:1px solid #374151;border-radius:6px;font-size:.85rem;background:#1a1a2e;color:#f3f4f6}
        .schedule-next{font-size:.8rem;color:#6b7280}
        .schedule-label{font-size:.85rem;color:#9ca3af;font-weight:500}
        .schedule-time{padding:.3rem .5rem;border:1px solid #374151;border-radius:6px;font-size:.85rem;font-family:inherit;background:#1a1a2e;color:#f3f4f6}
        .schedule-time:focus{outline:none;border-color:#6366f1}
        .schedule-day-wrap{display:inline-flex;gap:.5rem;align-items:center}
        .schedule-day-wrap select{padding:.3rem .5rem;border:1px solid #374151;border-radius:6px;font-size:.85rem;background:#1a1a2e;color:#f3f4f6}
        .cards{display:grid;gap:1rem;margin:1rem 0}
        .card{background:#222238;border-radius:8px;padding:1rem;border:1px solid #2d2b4a;border-left:4px solid #374151}
        .card.tier-high{border-left-color:#ef4444}
        .card.tier-medium{border-left-color:#fbbf24}
        .card.tier-low{border-left-color:#6366f1}
        .card-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:.5rem}
        .card-title{font-size:1.1rem;font-weight:600;color:#f3f4f6}
        .card-subtitle{color:#9ca3af;font-size:.9rem}
        .score{font-weight:700;padding:.25rem .5rem;border-radius:6px;font-size:.8rem;white-space:nowrap}
        .score-high{background:rgba(134,239,172,.15);color:#86efac}
        .score-medium{background:rgba(251,191,36,.15);color:#fbbf24}
        .score-low{background:rgba(99,102,241,.15);color:#a5b4fc}
        .score-none{background:rgba(107,114,128,.15);color:#6b7280}
        .card-reason{margin:.5rem 0;color:#d1d5db;font-size:.9rem;line-height:1.5}
        .card-urgency{font-size:.85rem;color:#fbbf24;font-weight:500}
        .card-fields{display:grid;grid-template-columns:1fr;gap:.4rem;margin-top:.75rem;padding-top:.75rem;border-top:1px solid #374151}
        .field{font-size:.85rem;line-height:1.5}
        .field-label{color:#6b7280;font-weight:500}
        .field-value{color:#d1d5db}
        .field-long{grid-column:1/-1}
        .card-action{margin-top:.75rem}
        .card-action a{color:#a5b4fc;text-decoration:none;font-weight:500}
        .card-action a:hover{color:#818cf8;text-decoration:underline}
        .card-footer{margin-top:.75rem;padding-top:.75rem;border-top:1px solid #374151;display:flex;gap:.5rem;align-items:center}
        .fb-btn{width:2rem;height:2rem;border:1px solid #374151;border-radius:50%;background:#1a1a2e;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .15s;color:#f3f4f6}
        .fb-btn:hover{background:#2d2b4a;transform:scale(1.1);border-color:#6366f1}
        .fb-btn.selected{border-color:#6366f1;background:rgba(99,102,241,.15)}
        .fb-up.selected{border-color:#86efac;background:rgba(134,239,172,.1)}
        .fb-down.selected{border-color:#ef4444;background:rgba(239,68,68,.1)}
        .fb-saved{color:#86efac;font-size:.8rem;font-weight:500}
        .fb-form{margin-top:.5rem}
        .fb-form-row{display:flex;gap:.4rem;align-items:center}
        .fb-note{flex:1;padding:.4rem .6rem;border:1px solid #374151;border-radius:6px;font-size:.85rem;font-family:inherit;background:#1a1a2e;color:#f3f4f6}
        .fb-note::placeholder{color:#6b7280}
        .fb-note:focus{outline:none;border-color:#6366f1}
        .fb-save{padding:.4rem .8rem;background:#6366f1;color:white;border:none;border-radius:6px;cursor:pointer;font-size:.85rem;transition:background .15s}
        .fb-save:hover{background:#4f46e5}
        .fb-cancel{padding:.4rem .6rem;background:transparent;border:1px solid #374151;border-radius:6px;cursor:pointer;font-size:.85rem;color:#9ca3af;transition:all .15s}
        .fb-cancel:hover{background:rgba(255,255,255,.06);color:#f3f4f6}
        section{margin:1.5rem 0}
        section h2{font-size:1.2rem;margin-bottom:.75rem;color:#f3f4f6}
        .status{padding:.75rem;background:#222238;border-radius:8px;font-size:.85rem;margin-bottom:1rem;border:1px solid #2d2b4a;color:#d1d5db}
        .status-error{border-left:3px solid #ef4444}
        .status-ok{border-left:3px solid #86efac}
        .empty{text-align:center;padding:2rem;color:#6b7280}
        .empty a{color:#a5b4fc}
        details{margin-top:.5rem}
        details summary{cursor:pointer;color:#a5b4fc;font-size:.85rem;font-weight:500}
        details summary:hover{color:#818cf8}
        details[open] summary{margin-bottom:.5rem}
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-inner">
                <h1>Opportunity Hunter</h1>
                <a href="/status" class="btn-status {{if .IsStatusPage}}active{{end}}">
                    {{if not .IsStatusPage}}<span class="status-dot"></span>{{end}}
                    System Status
                </a>
            </div>
            <nav>
                {{range .Hunts}}
                <a href="/?hunt={{.}}" {{if eq $.ActiveHunt .}}class="active"{{end}}>{{.}}</a>
                {{end}}
            </nav>
        </div>
    </header>
    <div class="container">
        {{if .IsStatusPage}}
            {{template "status" .}}
        {{else}}
            {{template "content" .}}
        {{end}}
    </div>
</body>
</html>
