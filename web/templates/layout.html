<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunity Hunter</title>
    <style>
        :root{color-scheme:dark;--bg:#151821;--surface:#1e2330;--border:#343d50;--text:#eef1f7;--muted:#aab4c6;--accent:#b1c5ff;--good:#86dfb0}
        *{box-sizing:border-box;margin:0;padding:0}
        [hidden]{display:none!important}
        body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
        .container{max-width:1040px;margin:0 auto;padding:1.25rem}
        a{color:var(--accent);text-underline-offset:3px}
        button,input,select,textarea{font:inherit}
        button,select,summary{cursor:pointer}
        button,input,select,textarea{border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);padding:.55rem .75rem;min-height:44px}
        button:hover{background:#303a50;border-color:var(--accent)}
        :focus-visible{outline:2px solid var(--accent)!important;outline-offset:3px}
        button:disabled{opacity:.6;cursor:wait}
        header{background:#11151d;border-bottom:1px solid var(--border)}
        .header-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
        header h1{font-size:1.4rem;letter-spacing:-.035em}
        nav{display:flex;gap:.4rem;margin-top:1rem;flex-wrap:wrap}
        nav a{color:var(--muted);text-decoration:none;padding:.6rem .9rem;border-radius:8px;text-transform:capitalize}
        nav a.active{background:#2d3953;color:#e2eaff}
        nav a:hover{background:#232c3e;color:white}
        .btn-status{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem .8rem;border:1px solid var(--border);border-radius:8px;color:var(--muted);text-decoration:none;font-size:.85rem;min-height:44px}
        .btn-status.active{color:var(--accent);border-color:var(--accent)}
        .status-dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex-shrink:0}
        .toolbar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin:.5rem 0 1rem;font-size:.875rem}
        .toolbar-right{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;width:100%}
        .run-status{color:var(--muted);display:inline-flex;align-items:center;gap:.45rem;flex-wrap:wrap}
        .schedule-next-inline{color:var(--muted);font-size:.8rem;margin-right:auto}
        .toolbar label{color:var(--muted)}
        .toolbar-control{display:flex;align-items:center;gap:.6rem;max-width:100%}
        .toolbar .count{margin-left:auto;color:var(--muted)}
        .prefs-toggle,.btn-ghost{color:var(--accent);font-size:.85rem}
        .prefs-panel{background:var(--surface);padding:1.25rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1.5rem}
        .prefs-header{margin-bottom:.7rem}
        .prefs-header strong{display:block;font-size:1rem}
        .prefs-hint{color:var(--muted);font-size:.85rem}
        .prefs-panel textarea{width:100%;min-height:100px;resize:vertical}
        textarea::placeholder,input::placeholder{color:var(--muted)}
        .prefs-panel button[type=submit],.fb-save{background:#405fa4;border-color:#6283cd;color:white}
        .prefs-panel button[type=submit]:hover,.fb-save:hover{background:#4e70b9}
        .schedule-form{margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--border)}
        .schedule-row,.schedule-day-wrap{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
        .schedule-label{color:var(--muted);font-size:.85rem}
        .cards{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem;margin:1rem 0}
        .card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:12px;padding:1.4rem;min-width:0;scroll-margin-top:1rem;overflow-wrap:anywhere}
        .card.tier-high{border-left-color:var(--good)}
        .card.tier-medium{border-left-color:#e7c375}
        .card.tier-low{border-left-color:#8ca7e8}
        .card-main{display:flex;gap:1rem;align-items:flex-start}
        .card-body{flex:1;min-width:0}
        .card-top-row{display:flex;flex-direction:column;gap:.15rem}
        .card-title{font-size:1.15rem;line-height:1.35;font-weight:650;letter-spacing:-.02em}
        .card-subtitle{font-size:.875rem;color:var(--muted)}
        .score{font-weight:650;padding:.35rem .6rem;border-radius:6px;font-size:.8rem;max-width:150px;flex-shrink:0}
        .score-high{background:#234238;color:#a2efc4}
        .score-medium{background:#403928;color:#f0d292}
        .score-low{background:#2d3852;color:#bed0ff}
        .score-none{background:#303641;color:#b7c0ce}
        .card-reason{margin:.7rem 0;color:#d0d8e8;font-size:.925rem;line-height:1.65;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .card-reason.expanded{-webkit-line-clamp:unset;overflow:visible}
        .card-reason-toggle{display:block;background:none;border:0;color:var(--accent);padding:.35rem 0;font-size:.85rem}
        .card-meta-row{display:flex;gap:.65rem;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
        .urgency-badge{background:#403928;color:#f0d292;padding:.25rem .5rem;border-radius:6px}
        details{margin-top:1rem}
        details summary{color:var(--accent);font-size:.85rem;padding:.5rem 0;min-height:44px}
        .card-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem 1.25rem;margin-top:.5rem;padding:1rem;background:#171c27;border-radius:8px}
        .field{font-size:.85rem;min-width:0}
        .field-label{display:block;color:var(--muted);font-size:.78rem;margin-bottom:.2rem}
        .field-value{color:#dce3f0;white-space:pre-line;overflow-wrap:anywhere}
        .field-long{grid-column:1/-1}
        .card-footer{margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap}
        .card-action-link{font-size:.9rem;font-weight:600;padding:.6rem .85rem;min-height:44px;border:1px solid #6283cd;border-radius:8px;background:#344d80;color:#e5edff;text-decoration:none}
        .card-action-link:hover{background:#405fa4}
        .fb-buttons{display:flex;gap:.5rem;align-items:center;margin-left:auto}
        .fb-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:0}
        .fb-up.selected{border-color:var(--good);background:#234238}
        .fb-down.selected{border-color:#f49b9b;background:#472c35}
        .fb-saved{color:var(--good);font-size:.8rem}
        .fb-form{margin-top:.8rem}
        .fb-form-row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
        .fb-note{flex:1 1 180px;min-width:0;width:100%}
        .fb-save,.fb-cancel{font-size:.85rem}
        .notice{background:#234238;border:1px solid #437b60;border-radius:8px;padding:.75rem 1rem;margin-bottom:1rem;color:#c3f2d8}
        .empty{text-align:center;padding:3rem 1rem;border:1px dashed var(--border);border-radius:12px;color:var(--muted);margin-top:1rem}
        .empty strong{display:block;color:var(--text);font-size:1.1rem;margin-bottom:.5rem}
        .empty p{max-width:440px;margin:auto;font-size:.9rem}
        @media(max-width:600px){.container{padding:1rem}.header-inner{gap:.5rem}header h1{font-size:1.2rem}.card{padding:1rem}.card-main{flex-direction:column;gap:.65rem}.score{max-width:100%}.toolbar select{max-width:100%}.toolbar-right{gap:.6rem}.run-status{width:100%}.schedule-next-inline{width:100%}.card-fields{grid-template-columns:minmax(0,1fr)}}
        @media(prefers-reduced-motion:no-preference){button,a{transition:background .15s,border-color .15s}}
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-inner">
                <h1>Opportunity Hunter</h1>
                <a href="/status" class="btn-status {{if .IsStatusPage}}active{{end}}">

                    System Status
                </a>
            </div>
            <nav>
                {{range .Hunts}}
                <a href="/?hunt={{.}}" {{if eq $.ActiveHunt .}}class="active" aria-current="page"{{end}}>{{.}}</a>
                {{end}}
            </nav>
        </div>
    </header>
    <main class="container">
        {{if .IsStatusPage}}
            {{template "status" .}}
        {{else}}
            {{template "content" .}}
        {{end}}
    </main>
</body>
</html>
