services:
  opportunity-hunter:
    # To build from source instead: comment 'image' and uncomment 'build'
    image: ghcr.io/seanmeyer/opportunity-hunter:latest
    # build: .
    env_file: .env
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
